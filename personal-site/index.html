<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alix Ollivier</title>
<meta name="description" content="Alix Ollivier, AI-enhanced creative strategist. The homepage opens with a marble machine: one push sends a chain reaction down four steps and reveals Games, Writing, Videos and About.">
<meta name="theme-color" content="#C7CFBC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#28303D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231543AE'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23F4502E'/%3E%3Cpath d='M8 14c4-4 8 4 16 0' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--CONTENT-->
<div class="app" id="app" data-state="loading">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <a class="skip-link" id="skipLink" href="#sections">Skip the machine</a>

  <header class="titleblock">
    <!-- Profile photo, loaded live from X/Twitter: put your handle (without the @) in data-x-handle.
         When you change your picture on X, this one follows (allow up to a day for caches). -->
    <a class="avatar" id="avatar" data-x-handle="aollivier82" target="_blank" rel="noopener">
      <span class="avatar-initials" aria-hidden="true">AO</span>
      <img id="avatarImg" alt="" width="96" height="96" decoding="async" referrerpolicy="no-referrer" hidden>
    </a>
    <div class="titletext">
      <h1>Alix Ollivier</h1>
      <p class="role">AI-enhanced creative strategist</p>
    </div>
  </header>

  <!-- The four places to click. Each link sits on top of its sign in the 3D scene.
       Change the label text or href here; the signs are drawn from these. -->
  <nav class="hits" id="sections" aria-label="Sections">
    <a class="hit" href="#games" data-color="red" data-icon="pad"><span>Games</span></a>
    <a class="hit" href="#writing" data-color="yellow" data-icon="pen"><span>Writing</span></a>
    <a class="hit" href="#videos" data-color="mint" data-icon="play"><span>Videos</span></a>
    <a class="hit" href="#about" data-color="pink" data-icon="face"><span>About</span></a>
  </nav>

  <div class="dock">
    <button class="push" id="push" type="button">Push the marble</button>
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <div class="tools">
    <button class="tool" id="skip" type="button" hidden>Skip</button>
    <button class="tool" id="replay" type="button" hidden>Run it again</button>
    <button class="tool" id="sound" type="button" aria-pressed="true" hidden>Sound on</button>
  </div>
</div>

<!-- What each popup shows: a <template> per section, named sheet-<href without #>.
     A section with no template opens an empty panel. -->
<template id="sheet-games">
  <article class="entry">
    <div class="entry-media">
      <img src="assets/balloon-bats/key-art.jpg" width="1200" height="675" alt="Balloon Bats key art: a small orange bat gliding over a floating island with an airship and hot-air balloons." loading="lazy">
      <p class="entry-caption">Key art. Balloon Bats, by Mayflower Worlds.</p>
    </div>
    <div class="entry-text">
      <p class="entry-eyebrow">Multiplayer VR &middot; Meta Quest &middot; Early Access</p>
      <h3>Balloon Bats</h3>
      <p class="entry-tagline">Your arms are your wings.</p>
      <p>Balloon Bats is a multiplayer VR adventure for Meta Quest. You play a small bat on a floating island high above the clouds, and there is no thumbstick for flying: you flap your real arms to take off, stretch them out to glide, and pull them in to dive. Your own body is the controller, and the sky is yours to figure out.</p>
      <p>Every flight starts at the treehouse, with a whole sky outside the door. From there the island opens up: an airship moored among the trees, a marsh dotted with lily pads, and supply balloons drifting just out of reach. Pop the balloons, carry fruit back home, and work toward your New Pioneers Badge.</p>
      <p>The island has locals, and not all of them are friendly. Keep an eye on the frogs in the marsh, and keep your wings ready. Stay out past sunset and the same island turns into a different kind of adventure: an owl starts hunting, and the lantern light is your only refuge.</p>
      <p>It is better with other bats. You meet other players in the air, find a flying buddy and share the view. The game is in Early Access, and its Discord community helps shape what comes next.</p>
      <dl class="entry-facts">
        <div><dt>Platform</dt><dd>Meta Quest (headset required)</dd></div>
        <div><dt>Players</dt><dd>Multiplayer</dd></div>
        <div><dt>Status</dt><dd>Early Access</dd></div>
        <div><dt>Studio</dt><dd>Mayflower Worlds</dd></div>
      </dl>
    </div>
    <div class="entry-gallery">
      <h4>Captured in the game</h4>
      <ul>
        <li><img src="assets/balloon-bats/airship.jpg" width="480" height="640" alt="An airship moored beside the treehouse on the island." loading="lazy"><span>The airship by the treehouse</span></li>
        <li><img src="assets/balloon-bats/frog.jpg" width="480" height="640" alt="A large frog sitting in the marsh among lily pads, a supply balloon floating behind it." loading="lazy"><span>Mind the locals</span></li>
        <li><img src="assets/balloon-bats/night.jpg" width="480" height="640" alt="The floating island at night, seen from above." loading="lazy"><span>The island after dark</span></li>
      </ul>
    </div>
    <div class="entry-links">
      <a class="entry-cta" href="https://www.meta.com/en-gb/experiences/balloon-bats/27706668015613967/" target="_blank" rel="noopener">Get it on Meta Quest &#8599;</a>
      <a href="https://balloonbatsvr.com/" target="_blank" rel="noopener">balloonbatsvr.com &#8599;</a>
      <a href="https://discord.gg/EfM38YrqDZ" target="_blank" rel="noopener">Join the Discord &#8599;</a>
    </div>
  </article>
</template>

<!-- The popup page each sign opens. -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" data-color="red">
    <header class="sheet-head">
      <canvas class="sheet-icon" id="sheetIcon" width="96" height="96" aria-hidden="true"></canvas>
      <h2 id="sheetTitle">Games</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="sheet-body" id="sheetBody" tabindex="-1"></div>
  </section>
</div>
<noscript><style>.app .hits{position:static;display:grid;gap:12px;padding-block:24px}.app .hit{position:static;width:auto;height:auto;padding:14px 18px;background:var(--label);border:2px solid var(--ink)}.app .hit span{position:static;width:auto;height:auto;clip-path:none;font:800 28px var(--font-display);text-transform:uppercase}.dock,.tools{display:none}</style></noscript>
<!--/CONTENT-->

     deprecation notice on load; the wrapper below keeps it out of the console. -->
<script>(function(){var w=console.warn;console.warn=function(m){if(typeof m==='string'&&m.indexOf('build/three.js')>-1)return;return w.apply(console,arguments)};window.__restoreWarn=function(){console.warn=w}})();</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/machine.js"></script>
<script src="js/room.js"></script>
<script src="js/app.js"></script>
</body>
</html>
